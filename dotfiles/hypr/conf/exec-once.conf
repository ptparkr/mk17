#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
exec-once = hyprlock
exec-once = hypridle
exec-once = waybar 
exec-once = bash -lc 'command -v powerprofilesctl >/dev/null 2>&1 && powerprofilesctl set balanced || true'

# wallpaper daemon (prefer swww, fallback to awww)
exec-once = bash -lc 'if command -v swww-daemon >/dev/null 2>&1; then swww-daemon; elif command -v awww-daemon >/dev/null 2>&1; then awww-daemon; fi'

exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# polkit agent
exec-once = systemctl --user start hyprpolkitagent

# gnome keyring
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets

# Mouse cursor
exec-once=hyprctl setcursor capitaine-cursors 32

# gammastep ( bluelight filter )
exec-once=gammastep -O 4500

# Clipboard history watchers (text + rich HTML + images)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type text/html --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Enable numlock - with delay to ensure input devices are ready
exec-once = sleep 2 && numlockx on

# MPD - load all music to playlist on startup (clear first to avoid duplicates)
exec-once = mpc -q clear && mpc add / && mpc play

# MPRIS bridge for playerctl/waybar
exec-once = mpd-mpris -no-instance

