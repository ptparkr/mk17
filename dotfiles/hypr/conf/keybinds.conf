   
####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier


#power menu
bind = $mainMod, O, exec , ~/.config/waybar/scripts/power-menu.sh


####################### Actions #######################
# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = SUPER, Q, exec, $fileManager # Open Thunar file manager

bind = $mainMod, C, killactive, # Close active window
bind = $mainMod, E, exec, $terminal
bind = $mainMode SHIFT, O, exec, obsidian
bind = $mainMode SHIFT, C, exec, cursor
bind = $mainMod, M, exec, helium-browser 
bind = $mainMod, N, exec, spotify-launcher
bind = $mainMod, B, exec, pavucontrol
bind = $mainMod SHIFT, N, exec, ~/.config/hypr/scripts/launch-cava.sh #Launch Cava using script
bind = $mainMod SHIFT, M, exit, # Exit Hyprland

# Special Keys
bind = $mainMod, P, exec, playerctl play-pause # Play/Pause media player
bind = ,XF86AudioPlay, exec, playerctl play-pause && mpc toggle
bind = ,XF86AudioStop, exec, playerctl stop && mpc stop
bind = ,XF86AudioPrev, exec, playerctl previous && mpc prev
bind = ,XF86AudioNext, exec, playerctl next && mpc next
bind = ,XF86MonBrightnessUp, exec, brightnessctl set 5%+ # Increase brightness by 5%
bind = ,XF86MonBrightnessDown, exec, brightnessctl set 5%- # Decrease brightness by 5%
bind = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle # Mute/Unmute audiou
bind = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ # Increase volume by 5%
bind = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- # Decrease volume by 5%


bind = $mainMod, SPACE, exec, bash -c "pgrep -x 'rofi' > /dev/null && pkill -x 'rofi' ||  ~/.config/rofi/launcher.sh" # Toggle Rofi launcher
bind = $mainMod SHIFT, B, exec, bash -c "pgrep -x 'waybar' > /dev/null && killall waybar || waybar &" # Toggle Waybar

bind = $mainMod SHIFT, W, exec, bash -lc 'if command -v swww-daemon >/dev/null 2>&1; then pgrep -x swww-daemon >/dev/null && swww kill || swww-daemon; elif command -v awww-daemon >/dev/null 2>&1; then pgrep -x awww-daemon >/dev/null && awww kill || awww-daemon; else notify-send "Wallpaper" "No wallpaper daemon found"; fi' # Toggle wallpaper daemon
bind = $mainMod, W, exec, bash -c "~/.config/scripts/wallpaper/change-wallpaper.sh"

# Change wallpaper to random
bind = $mainMod ALT, W, exec, bash -c "~/.config/scripts/wallpaper/change-wallpaper.sh"

# Toggle gammastep (bluelight filter)
bind = SUPER CTRL, B, exec, bash -c "pgrep gammastep > /dev/null && pkill gammastep || gammastep -O 4500"



######################### Windows #######################
bind = $mainMod, F, fullscreen, 0 # Set active window to fullscreen
bind = $mainMod SHIFT, F, fullscreen, 1 # Maximize window
bind = $mainMod, T, togglefloating # Toggle active windows into floating mode
bind = $mainMod SHIFT, T, workspaceopt, allfloat # Toggle all windows into floating mode
bind = SUPER SHIFT, H, swapwindow, l
bind = SUPER SHIFT, L, swapwindow, r
bind = SUPER SHIFT, K, swapwindow, u
bind = SUPER SHIFT, J, swapwindow, d

bind = $mainMod, U, pseudo # Toggle split

# Move focus with mainMod + vim navigation
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
#
# Move focus with mainMod + SHIFT + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Resize active window with mainMod + SHIFT + arrow keys
bind = $mainMod SHIFT, right, resizeactive, 100 0 # Increase window width with keyboard
bind = $mainMod SHIFT, left, resizeactive, -100 0 # Reduce window width with keyboard
bind = $mainMod SHIFT, down, resizeactive, 0 100 # Increase window height with keyboard
bind = $mainMod SHIFT, up, resizeactive, 0 -100 # Reduce window height with keyboard

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


###############################################################################################3## CUSTOM


# Screenshot
bind = $mainMod ALT SHIFT, X, exec, $HOME/.config/scripts/screenshots/captureFullScreen.sh
bind = $mainMod ALT, X, exec, $HOME/.config/scripts/screenshots/captureSelectArea.sh

# Clipboard
bind = $mainMod, V, exec, ~/.config/hypr/scripts/clipboard-menu.sh pick
bind = $mainMod CTRL, V, exec, ~/.config/hypr/scripts/clipboard-menu.sh latest
bind = $mainMod ALT, V, exec, ~/.config/hypr/scripts/clipboard-menu.sh delete
bind = $mainMod SHIFT, V, exec, ~/.config/hypr/scripts/clipboard-menu.sh clear



